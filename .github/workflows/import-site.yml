name: Import public website snapshot
on:
  push:
    paths:
      - '.github/workflows/import-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import verified static files
        run: |
          curl --fail --location --retry 3 --max-time 240 'https://sell-activated-legislature-evolution.trycloudflare.com/site.zip' -o /tmp/site.zip
          echo 'a338bfc726a3078a13ad915ccf035304763ebe30763d8d9a1ab67dee29ec7c7c  /tmp/site.zip' | sha256sum -c -
          unzip -o /tmp/site.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .nojekyll README.md content.json posts.json gallery.json css js img uploads
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete static website with media'
            git push origin HEAD:main
          fi
