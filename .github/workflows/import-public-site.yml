name: Import public site snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-site.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify public website export
        run: |
          curl --fail --location --retry 2 --max-time 180 'https://kardapolovstanislav.ru:8443/kardapolov-pages-export-a338bfc726a3078a.zip' -o /tmp/site.zip
          echo 'a338bfc726a3078a13ad915ccf035304763ebe30763d8d9a1ab67dee29ec7c7c  /tmp/site.zip' | sha256sum -c -
          unzip -o /tmp/site.zip -d .
      - name: Commit static files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html content.json posts.json gallery.json css js img uploads .nojekyll README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import standalone website and public media'
          git push origin HEAD:main
